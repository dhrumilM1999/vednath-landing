name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Build tools only (lightningcss, esbuild). GSAP and fonts are already vendored in /assets.
      - run: npm ci --no-audit --no-fund
      - name: Build for the /vednath-landing/ sub-path
        run: node scripts/build.mjs
        env:
          BASE: /${{ github.event.repository.name }}/
      # Keep the first design online for comparison at /<repo>/v1/ (built from the v1 tag)
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1src
      - name: Build v1 into dist/v1
        working-directory: v1src
        run: npm ci --no-audit --no-fund && node scripts/build.mjs && cp -r dist ../dist/v1
        env:
          BASE: /${{ github.event.repository.name }}/v1/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
